<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026년 용인시수지장애인복지관 SAY심리상담센터 사례컨퍼런스 만족도 조사</title>
<meta property="og:title" content="2026년 용인시수지장애인복지관 SAY심리상담센터 사례컨퍼런스 만족도 조사">
<meta property="og:description" content="상담사례컨퍼런스(공개사례발표회)에 참여해 주셔서 감사합니다. 더 나은 컨퍼런스를 위해 솔직한 의견을 들려주세요. 응답은 무기명으로 처리됩니다.">
<meta property="og:image" content="invite.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --c:#8a2c6e; --c-dk:#6d1f56; --c-tint:#f7eef4;
    --g:#b8923a; --g-tint:#fbf6ea;
    --ink:#2b2530; --muted:#7a7280; --bd:#e6dfd3; --field:#fdfbf7;
    --bg:#f6f1e9; --err:#c0392b;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-size:16px; line-height:1.5;
         font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:620px; margin:0 auto; padding:20px 16px 40px; }
  .card { background:#fff; border:1px solid var(--bd); border-radius:16px; padding:22px 20px; margin-bottom:14px;
          box-shadow:0 1px 2px rgba(60,40,20,.04), 0 6px 18px rgba(60,40,20,.05); }
  .head { text-align:center; padding:30px 20px 24px; }
  .ornament { display:flex; align-items:center; justify-content:center; gap:10px; color:var(--g); font-size:12px; letter-spacing:.2em; margin-bottom:14px; }
  .ornament::before, .ornament::after { content:""; height:1px; width:44px; background:linear-gradient(90deg,transparent,var(--g)); }
  .ornament::after { transform:scaleX(-1); }
  h1 { margin:0; font-size:21px; word-break:keep-all; font-weight:800; line-height:1.4; letter-spacing:-.02em; }
  h1 .l1 { display:block; font-size:19px; font-weight:700; color:var(--ink); }
  h1 .l2 { display:block; color:var(--c); }
  .sub { margin:10px 0 0; color:var(--g); font-weight:600; font-size:14px; letter-spacing:.04em; }
  .intro { background:var(--g-tint); border:1px solid #efe2c2; border-left:4px solid var(--g); box-shadow:none;
           line-height:1.75; font-size:15px; color:#5a4a2c; padding:18px 20px; word-break:keep-all; }
  .req { color:var(--c); margin-left:2px; }
  .hint { color:var(--muted); font-size:13px; font-weight:400; margin-left:4px; }
  /* 문항 */
  .q { font-weight:600; font-size:16px; line-height:1.6; margin:0 0 14px; word-break:keep-all; display:flex; gap:8px; }
  .q .no { flex:none; font-size:12px; font-weight:700; color:var(--c); background:var(--c-tint); border-radius:999px; padding:3px 9px; height:fit-content; margin-top:2px; }
  .scale { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .scale.col4 { grid-template-columns:repeat(4,1fr); }
  .scale label { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center;
                 padding:12px 4px; border:1px solid var(--bd); border-radius:10px; background:var(--field); cursor:pointer;
                 font-size:13.5px; line-height:1.3; word-break:keep-all; transition:all .15s; min-height:72px; }
  .scale input { width:18px; height:18px; margin:0; accent-color:var(--c); }
  .scale label:has(input:checked) { border-color:var(--c); background:var(--c-tint); color:var(--c-dk); font-weight:700; }
  .reason { margin-top:12px; display:none; }
  .reason.on { display:block; }
  .reason p { margin:0 0 6px; font-size:14px; font-weight:600; color:var(--c-dk); }
  textarea { width:100%; min-height:96px; padding:12px 14px; border:1px solid var(--bd); border-radius:10px; font:inherit; font-size:16px;
             background:var(--field); color:var(--ink); resize:vertical; line-height:1.6; }
  textarea:focus { outline:none; border-color:var(--c); box-shadow:0 0 0 3px rgba(138,44,110,.14); background:#fff; }
  .card.miss { border-color:var(--err); box-shadow:0 0 0 2px rgba(192,57,43,.15); }
  button.primary { width:100%; margin-top:6px; background:var(--c); color:#fff; border:0; padding:16px; font-weight:700; font-size:17px; font:inherit;
                   border-radius:12px; box-shadow:0 6px 16px rgba(138,44,110,.25); cursor:pointer; transition:background .15s, transform .05s; }
  button.primary { font-weight:700; font-size:17px; }
  button.primary:hover { background:var(--c-dk); }
  button.primary:active { transform:translateY(1px); }
  button:disabled { opacity:.55; cursor:default; }
  .err { color:var(--err); font-size:14px; min-height:20px; margin-top:10px; white-space:pre-line; }
  .done { text-align:center; padding:48px 20px; }
  .done .big { width:64px; height:64px; margin:0 auto 14px; border-radius:50%; background:var(--c-tint); color:var(--c);
               display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; }
  .done h2 { margin:0; font-size:18px; }
  .done .sub { color:var(--muted); letter-spacing:0; font-weight:400; line-height:1.7; word-break:keep-all; }
  @media (max-width:420px) { .scale { gap:4px; } .scale label { font-size:12.5px; padding:10px 2px; } .scale.col4 { grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <div id="formView">
    <div class="card head">
      <div class="ornament">SURVEY</div>
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="card intro" id="intro"></div>
    <div id="items"></div>
    <button class="primary" id="submitBtn" type="button">제출하기</button>
    <div class="err" id="err"></div>
  </div>
  <div id="doneView" class="card done" style="display:none">
    <div class="big">✓</div>
    <h2>응답이 제출되었습니다</h2>
    <p class="sub" id="thanks"></p>
  </div>
</div>
<script>
const CFG = {
  "title":"2026년 용인시수지장애인복지관 SAY심리상담센터 사례컨퍼런스",
  "titleLines":["2026년 용인시수지장애인복지관","SAY심리상담센터 사례컨퍼런스"],
  "subtitle":"만족도 조사",
  "intro":"상담사례컨퍼런스(공개사례발표회)에 참여해 주셔서 감사합니다. 더 나은 컨퍼런스를 위해 솔직한 의견을 들려주세요. 응답은 무기명으로 처리됩니다.",
  "scale":["매우 만족","만족","보통","불만족","매우 불만족"],
  "reasonFor":["불만족","매우 불만족"],
  "reasonLabel":"그렇게 생각하신 이유를 적어 주세요.",
  "items":[
    {
      "type":"radio",
      "q":"참여하신 직군을 선택해 주세요.",
      "options":["상담자","슈퍼바이저","기관 관리자","기타"]
    },
    {
      "type":"scale",
      "q":"행사 시간, 장소, 진행 방식 및 안내 등 전반적인 운영은 적절하였습니까?"
    },
    {
      "type":"scale",
      "scale":["매우 그렇다","그렇다","보통","그렇지 않다","전혀 그렇지 않다"],
      "reasonFor":["그렇지 않다","전혀 그렇지 않다"],
      "q":"상담자가 발표한 상담사례의 사례개념화 및 상담과정에 대한 설명은 이해하기 쉬웠습니까?"
    },
    {
      "type":"scale",
      "scale":["매우 그렇다","그렇다","보통","그렇지 않다","전혀 그렇지 않다"],
      "reasonFor":["그렇지 않다","전혀 그렇지 않다"],
      "q":"수퍼바이저의 슈퍼비전이 사례를 이해하고 상담적 개입 방향을 모색하는 데 도움이 되었습니까?"
    },
    {
      "type":"scale",
      "scale":["매우 그렇다","그렇다","보통","그렇지 않다","전혀 그렇지 않다"],
      "reasonFor":["그렇지 않다","전혀 그렇지 않다"],
      "q":"이번 컨퍼런스가 상담 지식과 기술을 확장하고 상담자로서의 전문성을 높이는 데 도움이 되었습니까?"
    },
    {
      "type":"scale",
      "scale":["매우 그렇다","그렇다","보통","그렇지 않다","전혀 그렇지 않다"],
      "reasonFor":["그렇지 않다","전혀 그렇지 않다"],
      "q":"이번 컨퍼런스에서 얻은 지식과 통찰을 실제 상담 현장에 적용할 수 있다고 생각하십니까?"
    },
    {
      "type":"scale",
      "q":"이번 상담사례컨퍼런스(공개사례발표회)에 전반적으로 만족하셨습니까?"
    },
    {
      "type":"scale",
      "scale":["반드시 참여","참여 예정","미정","참여하지 않을 것","절대 참여하지 않을 것"],
      "reasonFor":["참여하지 않을 것","절대 참여하지 않을 것"],
      "q":"향후 제3회 상담사례컨퍼런스(공개사례발표회)가 개최된다면 다시 참여하실 의향이 있으십니까?"
    },
    {
      "type":"text",
      "q":"자유롭게 의견을 남겨 주세요.",
      "optional":true,
      "placeholder":"① 유익했던 점:\n\n② 개선되었으면 하는 점:\n\n③ 다루었으면 하는 사례 주제:"
    }
  ],
  "thanks":"소중한 의견 감사합니다. 보내주신 의견은 다음 컨퍼런스 운영에 반영하겠습니다."
};
const API_URL = 'https://script.google.com/macros/s/AKfycbzkH__Rc01bDihE0ytIIqDGtxYFtGAUSjXhyL43arF0M7rzmj-8AX6LxULdkZcW4NbE3w/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('title').innerHTML = CFG.titleLines.map((t, i) => `<span class="l${i + 1}">${esc(t)}</span>`).join('');
$('subtitle').textContent = CFG.subtitle;
$('intro').textContent = CFG.intro;
$('thanks').textContent = CFG.thanks;

$('items').innerHTML = CFG.items.map((it, i) => {
  const head = `<p class="q"><span class="no">${String(i + 1).padStart(2, '0')}</span><span>${esc(it.q)}${it.optional ? ' <span class="hint">(선택)</span>' : ' <span class="req">*</span>'}</span></p>`;
  if (it.type === 'radio') {
    return `<div class="card" id="card${i}">${head}
      <div class="scale col4">${it.options.map(s => `<label><input type="radio" name="q${i}" value="${esc(s)}">${esc(s)}</label>`).join('')}</div>
    </div>`;
  }
  if (it.type === 'scale') {
    const itemScale = it.scale || CFG.scale;
    const itemReasonFor = it.hasOwnProperty('reasonFor') ? it.reasonFor : CFG.reasonFor;
    const hasReason = itemReasonFor && itemReasonFor.length > 0;
    return `<div class="card" id="card${i}">${head}
      <div class="scale">${itemScale.map(s => `<label><input type="radio" name="q${i}" value="${esc(s)}">${esc(s)}</label>`).join('')}</div>
      ${hasReason ? `<div class="reason" id="reason${i}"><p>${esc(CFG.reasonLabel)} <span class="req">*</span></p><textarea id="rt${i}" maxlength="2000"></textarea></div>` : ''}
    </div>`;
  }
  return `<div class="card" id="card${i}">${head}<textarea id="tx${i}" maxlength="4000" placeholder="${esc(it.placeholder || '자유롭게 적어 주세요')}"></textarea></div>`;
}).join('');

// 라디오 변경 시 miss 해제
CFG.items.forEach((it, i) => {
  if (it.type === 'radio') {
    document.querySelectorAll(`input[name=q${i}]`).forEach(r => r.addEventListener('change', () => {
      $('card' + i).classList.remove('miss');
    }));
    return;
  }
  if (it.type !== 'scale') return;
  const itemReasonFor = it.hasOwnProperty('reasonFor') ? it.reasonFor : CFG.reasonFor;
  document.querySelectorAll(`input[name=q${i}]`).forEach(r => r.addEventListener('change', () => {
    const on = itemReasonFor && itemReasonFor.includes(r.value);
    const reasonEl = $('reason' + i);
    if (reasonEl) {
      reasonEl.classList.toggle('on', on);
      if (on) setTimeout(() => $('rt' + i).focus(), 50);
    }
    $('card' + i).classList.remove('miss');
  }));
});

$('submitBtn').addEventListener('click', () => {
  const data = { type: 'survey', answers: [], reasons: [], texts: [] };
  const miss = [];
  document.querySelectorAll('.card.miss').forEach(c => c.classList.remove('miss'));
  CFG.items.forEach((it, i) => {
    if (it.type === 'radio') {
      const sel = document.querySelector(`input[name=q${i}]:checked`);
      const a = sel ? sel.value : '';
      data.answers.push(a); data.reasons.push(''); data.texts.push('');
      if (!a) { miss.push(`${i + 1}번 문항`); $('card' + i).classList.add('miss'); }
    } else if (it.type === 'scale') {
      const itemReasonFor = it.hasOwnProperty('reasonFor') ? it.reasonFor: CFG.reasonFor;
      const sel = document.querySelector(`input[name=q${i}]:checked`);
      const a = sel ? sel.value : '';
      const rtEl = $('rt' + i);
      const r = (itemReasonFor && itemReasonFor.includes(a) && rtEl) ? rtEl.value.trim() : '';
      data.answers.push(a); data.reasons.push(r); data.texts.push('');
      if (!a) miss.push(`${i + 1}번 문항 `);
      else if (itemReasonFor && itemReasonFor.includes(a) && !r) miss.push(`${i + 1}번 문항의 이유`);
      if (!a || (itemReasonFor && itemReasonFor.includes(a) && !r)) $('card' + i).classList.add('miss');
    } else {
      const t = $('tx' + i).value.trim();
      data.answers.push(''); data.reasons.push(''); data.texts.push(t);
      if (!it.optional && !t) { miss.push(`${i + 1}번 문항`); $('card' + i).classList.add('miss'); }
    }
  });
  if (miss.length) {
    $('err').textContent = '다음 항목을 확인해 주세요:\n· ' + miss.join('\n· ');
    const first = document.querySelector('.card.miss');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  $('err').textContent = '';
  $('submitBtn').disabled = true; $('submitBtn').textContent = '제출 중...';
  const ok = () => { $('formView').style.display = 'none'; $('doneView').style.display = ''; window.scrollTo(0, 0); };
  const fail = msg => {
    $('err').textContent = msg || '제출 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';
    $('submitBtn').disabled = false; $('submitBtn').textContent = '제출하기';
  };
  if (window.google && google.script && google.script.run) {
    google.script.run.withSuccessHandler(ok).withFailureHandler(err => fail(err && err.message)).api_survey(data);
  } else {
    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) })
      .then(r => r.json())
      .then(res => res.ok ? ok() : fail(res.error))
      .catch(() => fail('네트워크 오류로 제출하지 못했습니다. 잠시 후 다시 시도해 주세요.'));
  }
});
</script>
</body>
</html>
